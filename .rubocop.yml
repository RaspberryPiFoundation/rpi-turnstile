---
inherit_from:
  - https://raspberrypifoundation.github.io/digital-engineering/configs/rubocop-base.yml
  - https://raspberrypifoundation.github.io/digital-engineering/configs/rubocop-performance.yml
  - https://raspberrypifoundation.github.io/digital-engineering/configs/rubocop-rspec.yml
  - .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

# view_component 4.x no longer has a default initializer, so rubocop will complain about not calling super
Lint/MissingSuper:
  Exclude:
    - 'app/components/**/*.rb'

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - 'spec/dummy/config/**/*'
    - 'spec/dummy/app/**/*'
    - 'spec/dummy/bin/**/*'
    - 'vendor/**/*'
    - 'bin/rails'
    - "gemfiles/**/*.gemfile" # Exclude Appraisal-generated Gemfiles
